<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Japon 2026</title>

    <!-- PWA & Icônes (iPhone & Web) -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Japon 2026">

    <!-- Style CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- En-tête de l'application -->
    <header class="app-header">
        <img src="icon.png" alt="Logo" class="header-icon">
        <h1>Voyage au Japon</h1>
    </header>

    <!-- Barre de navigation -->
    <nav class="app-nav" id="main-nav">
        <button class="nav-btn active" onclick="afficherPlanning()">📅 Planning</button>
        <!-- Les boutons de villes seront générés automatiquement ici -->
    </nav>

    <!-- Contenu dynamique -->
    <main class="app-content" id="app-content">
        <div class="loading">Chargement des données...</div>
    </main>

    <!-- Script principal -->
    <script src="script.js"></script>
</body>
</html>
