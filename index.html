<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#11100E">
  <title>Japon 2026</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="tokyo">
  <main class="app-shell" id="app-shell">
    <!-- Page Itinéraire (avec détail des villes intégré) -->
    <section class="top-page" id="page-itinerary" data-page="itinerary">
      <div class="page-scroll">
        <div class="content-wrapper">
          <h1>Itinéraire</h1>
          <p class="subtitle">Le fil du voyage, de Tokyo à Tokyo.</p>
          <div class="journey-line" id="timeline-list"></div>
        </div>
      </div>
    </section>

    <!-- Page Détail d'une ville (affichée comme une page à part) -->
    <section class="top-page" id="page-city-detail" data-page="city-detail">
      <div class="page-scroll">
        <div class="content-wrapper">
          <button class="back-link" id="city-back" type="button"><span>‹</span> Itinéraire</button>
          <div class="city-hero">
            <h1 id="current-city-title"></h1>
            <div class="city-jp" id="current-city-jp"></div>
          </div>
          <div id="city-categories"></div>
        </div>
      </div>
    </section>

    <!-- Page Planning -->
    <section class="top-page" id="page-planning" data-page="planning">
      <div class="page-scroll">
        <div class="content-wrapper">
          <h1 class="sr-only">Planning</h1>
          <div class="planning-head" id="planning-head"></div>
          <div class="day-strip" id="day-strip"></div>
          <div id="planning-container"></div>
        </div>
      </div>
    </section>

    <!-- Page Lexique -->
    <section class="top-page" id="page-lexicon" data-page="lexicon">
      <div class="page-scroll">
        <div class="content-wrapper">
  <div class="lexicon-heading">
    <h1>Lexique</h1>
    <p class="subtitle">Expressions indispensables.</p>
  </div>

  <div class="lexicon-search">
    <span class="lexicon-search-icon">⌕</span>
    <input
      type="text"
      id="lexicon-search"
      placeholder="Rechercher un mot…"
      autocomplete="off"
    >
  </div>

  <div class="lexicon-list-heading">
    <h2>Expressions utiles</h2>
    <span class="lexicon-count" id="lexicon-count">00 EXPRESSIONS</span>
  </div>

  <div class="paper-list" id="lexicon-container"></div>

  <div class="editorial-block">
    <div class="block-label">NAVIGATION</div>
    <h2>Plans / Maps</h2>
    <button class="map-setting" id="map-setting" type="button">
      <span>Choisir l'application par défaut</span>
      <span>›</span>
    </button>
  </div>
</div>
  </main>

  <!-- Barre de navigation avec 3 onglets (répartition égale) -->
  <nav class="bottom-nav" id="bottom-nav" aria-label="Navigation principale">
    <button class="nav-item active" data-page="itinerary" type="button">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="5" cy="6" r="1.5"/>
          <circle cx="19" cy="18" r="1.5"/>
          <path d="M6.5 6.5c5 0 5 4 5 4s0 4 5 4h2"/>
        </svg>
      </span>
      <span>Itinéraire</span>
    </button>
    <button class="nav-item" data-page="planning" type="button">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4" y="5" width="16" height="15" rx="1"/>
          <path d="M8 3v4M16 3v4M4 9h16M8 13h2M13 13h2M8 17h2"/>
        </svg>
      </span>
      <span>Planning</span>
    </button>
    <button class="nav-item" data-page="lexicon" type="button">
      <span class="nav-icon">文</span>
      <span>Lexique</span>
    </button>
  </nav>

  <!-- Overlay pour le choix des maps -->
  <div class="choice-overlay" id="maps-choice-overlay" aria-hidden="true">
    <div class="choice-sheet">
      <button class="choice-close" id="maps-choice-close" type="button" aria-label="Fermer">×</button>
      <div class="block-label">NAVIGATION</div>
      <h2>Ouvrir le lieu avec</h2>
      <p>Ton choix sera mémorisé pour les prochains lieux.</p>
      <button class="map-choice" data-map-choice="apple" type="button">
        <span>Apple Plans</span>
        <span>›</span>
      </button>
      <button class="map-choice" data-map-choice="google" type="button">
        <span>Google Maps</span>
        <span>›</span>
      </button>
    </div>
  </div>

  <script src="places.js"></script>
  <script src="lexicon.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator)
      navigator.serviceWorker.register("./sw.js").catch(console.error);
  </script>
</body>
</html>
